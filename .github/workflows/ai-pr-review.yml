name: AI PR review

on:
  workflow_call:
    inputs:
      model:
        description: OpenRouter model id
        required: false
        type: string
        default: x-ai/grok-4.7
      omit_prefixes:
        description: Comma-separated path prefixes left out of the diff
        required: false
        type: string
        default: ""
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI PR review
    if: >-
      ${{
        (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
        )
        ||
        (
          github.event_name != 'issue_comment'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In a reusable workflow, github.workflow_ref and github.workflow_sha
      # describe the caller's workflow, not this one. job_workflow_sha is the
      # commit of this file; if GitHub leaves it empty, checkout falls back to
      # this repository's default branch.
      - name: Checkout reviewer
        uses: actions/checkout@v4
        with:
          repository: parsel-dev/ai-pr-review
          ref: ${{ github.job_workflow_sha }}
          persist-credentials: false

      - name: Review the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PR_REVIEW_MODEL: ${{ inputs.model }}
          AI_PR_REVIEW_OMIT_PREFIXES: ${{ inputs.omit_prefixes }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 ai_pr_review.py
